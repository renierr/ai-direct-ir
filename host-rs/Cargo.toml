[package]
name = "host-rs"
version = "1.0.1"
edition = "2024"

[dependencies]
wasmtime = "48"
wasmtime-wasi = { version = "48", features = ["p1"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
crossterm = "0.28"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
