# A real CLI: `air run examples/sha256sum/host.toml <file>`.
# `root` is the directory the app may read, resolved relative to THIS file.
# For a file elsewhere, grant it at the command line instead:
#   air run --dir . <manifest> <file>      the directory you ran from
#   air run --dir / <manifest> /abs/path   everything
# or set `root = "/"` here.
mode = "command"
root = "."
guest = "/work"

# The provider is vendored, not fetched. Its hash is recorded in
# vendor/ai-direct-sha256-0.1.0/checksums.txt.
[[providers]]
path = "vendor/ai-direct-sha256-0.1.0/artifacts/wasm32-wasi/sha256.component.wasm"

[app]
source = "sha256sum.wat"
path = "sha256sum.wasm"
run = "wasi:cli/run"
