# Responsive raw-key setup UI: a WASI 0.2 component with WAT state, the
# project's terminal interface, and a vendored Unicode width provider.
# Requires an interactive terminal; run the scriptable prompts example for
# pipes.
mode = "command"

# Terminal columns are neither bytes nor characters. This package wraps the
# `unicode-width` crate as a component; its WIT contract, artifact hash and
# upstream licences travel with it under vendor/.
[[providers]]
path = "vendor/ai-direct-text-width-0.1.0/artifacts/wasm32-wasi/text-width.component.wasm"

[app]
source = "prompts-raw.wat"
path = "prompts-raw.wasm"
run = "wasi:cli/run"
