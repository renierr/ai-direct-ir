# Responsive raw-key setup UI: a WASI 0.2 component with WAT state, the
# project's terminal interface, and a locked Unicode width provider.
# Requires an interactive terminal; run the scriptable prompts example for
# pipes.
mode = "command"

# Terminal columns are neither bytes nor characters. This package wraps the
# `unicode-width` crate as a component. Restore it after cloning with:
# air add --from ../../../ai-direct-ir-providers/providers/text-width ai-direct:text-width@0.1.0
[[providers]]
package = "ai-direct:text-width"
version = "0.1.0"

[app]
source = "prompts-raw.wat"
path = "prompts-raw.wasm"
run = "wasi:cli/run"
