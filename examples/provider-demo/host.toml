# A component consuming another component's interface.
#
# air instantiates provider.wasm and forwards its exported functions into
# consumer.wasm's imports at link time. No build-time composition tool is
# involved; the trade is that the bundle ships both components rather than one
# fused artifact, and resource handles do not cross the boundary.
mode = "command"

[app]
source = "consumer.wat"
path = "consumer.wasm"
run = "wasi:cli/run"

[[providers]]
source = "provider.wat"
path = "provider.wasm"
