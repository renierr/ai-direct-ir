# Static file server: WAT app + WAT lib + Rust bridge, one harness.
# Paths are relative to THIS file. Run from anywhere:
#   air examples/server/manifest.toml
mode = "server"
port = 8124
root = "www"
memory_pages = 2

[[libs]]
path = "../../libs/http/http.wasm"
as = "lib"

[[bridges]]
path = "../../libs/sha256/sha256.wasm"
as = "bridge"
alloc = "sha256_alloc"

[[bridges.calls]]
as = "sha256"
func = "sha256_hex"
in_ptr = 0
in_len = 1
out_ptr = 2
out_len = 64
max_in = 7000

[app]
source = "server.wat"
path = "server.wasm"
run = "run"
