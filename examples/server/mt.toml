# Same modules as manifest.toml, but the HOST owns the accept loop:
# N worker threads, each with a fully linked instance, run `handle`
# per connection. Same server.wasm — only the entry differs.
#   air examples/server/mt.toml   # :8124, 8 workers
mode = "server"
port = 8124
root = "www"
memory_pages = 2
workers = 8

[[libs]]
path = "../../libs/http/http.wasm"
as = "lib"

[[bridges]]
path = "../../libs/sha256/sha256.wasm"
as = "bridge"
alloc = "sha256_alloc"

[[bridges.calls]]
as = "sha256"
func = "sha256_hex"
in_ptr = 0
in_len = 1
out_ptr = 2
out_len = 64
max_in = 7000

[app]
source = "server.wat"
path = "server.wasm"
run = "handle"
