# Static file server: WAT app + WAT lib + Rust bridge, one harness.
# Run from repo root: host-rs srv/manifest.toml
mode = "server"
port = 8124
root = "srv/www"
memory_pages = 2

[[libs]]
path = "lib/http.wasm"
as = "lib"

[[bridges]]
path = "lib/sha256.wasm"
as = "bridge"
alloc = "sha256_alloc"

[[bridges.calls]]
as = "sha256"
func = "sha256_hex"
in_ptr = 0
in_len = 1
out_ptr = 2
out_len = 64
max_in = 7000

[app]
path = "srv/server.wasm"
run = "run"
